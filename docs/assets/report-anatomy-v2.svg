<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Decision-grade report anatomy</title>
  <desc id="desc">A realistic evidence report connected to classification, advertisement timeline, transcript, seven key frames, product marketing insight, and quality assurance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060919"/><stop offset="0.55" stop-color="#0b1127"/><stop offset="1" stop-color="#18153b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67e8f9"/><stop offset="0.5" stop-color="#818cf8"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
    <linearGradient id="paperHead" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111831"/><stop offset="1" stop-color="#292557"/></linearGradient>
    <linearGradient id="thumbA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cda7be"/><stop offset="0.45" stop-color="#6c577e"/><stop offset="1" stop-color="#211c36"/></linearGradient>
    <linearGradient id="thumbB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d1c8db"/><stop offset="1" stop-color="#725f8d"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.024"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="190%"><feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#02030b" flood-opacity="0.78"/></filter>
    <filter id="smallShadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#02030b" flood-opacity="0.4"/></filter>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1800" height="900" rx="40" fill="url(#bg)"/>
  <rect width="1800" height="900" rx="40" fill="url(#grid)"/>
  <ellipse cx="900" cy="875" rx="710" ry="180" fill="#7c3aed" opacity="0.08"/>

  <g font-family="Inter, SF Pro Display, Helvetica Neue, Arial, sans-serif">
    <text x="72" y="68" fill="#b3a9ff" font-size="13" font-weight="700" letter-spacing="4">DECISION-GRADE DELIVERABLE</text>
    <text x="72" y="111" fill="#f8fafc" font-size="30" font-weight="700">A report designed to be read—and challenged</text>
    <text x="72" y="143" fill="#8f9bb3" font-size="15">Strategy in the center. Source evidence around every conclusion.</text>

    <!-- Back pages -->
    <g filter="url(#shadow)">
      <rect x="584" y="164" width="650" height="650" rx="24" fill="#151a32" transform="rotate(3 909 489)" stroke="#818cf8" stroke-opacity="0.17"/>
      <rect x="568" y="156" width="650" height="650" rx="24" fill="#10162a" transform="rotate(-2 893 481)" stroke="#67e8f9" stroke-opacity="0.14"/>
    </g>

    <!-- Main report -->
    <g filter="url(#shadow)">
      <rect x="555" y="145" width="690" height="675" rx="22" fill="#f7f8fc"/>
      <rect x="555" y="145" width="690" height="116" rx="22" fill="url(#paperHead)"/>
      <rect x="555" y="237" width="690" height="24" fill="url(#paperHead)"/>
      <text x="591" y="181" fill="#aeb8ff" font-size="10" font-weight="700" letter-spacing="2.4">DOUYIN SOCIAL COMMERCE INTELLIGENCE</text>
      <text x="591" y="215" fill="#ffffff" font-size="24" font-weight="700">Video evidence brief</text>
      <text x="591" y="240" fill="#9aa7c0" font-size="11">Content structure · product integration · persuasion strategy</text>
      <rect x="1090" y="177" width="118" height="30" rx="15" fill="#4038a8"/><text x="1149" y="197" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700" letter-spacing="1">QA PASSED</text>

      <!-- Summary row -->
      <text x="591" y="293" fill="#1e293b" font-size="10" font-weight="700" letter-spacing="1.5">EXECUTIVE SUMMARY</text>
      <rect x="591" y="310" width="134" height="46" rx="10" fill="#eef0ff"/><text x="607" y="328" fill="#667085" font-size="9">PRIMARY LABEL</text><text x="607" y="347" fill="#4338ca" font-size="13" font-weight="700">SEEDING</text>
      <rect x="737" y="310" width="134" height="46" rx="10" fill="#effbff"/><text x="753" y="328" fill="#667085" font-size="9">AD SHARE</text><text x="753" y="347" fill="#087f9c" font-size="13" font-weight="700">29.5%</text>
      <rect x="883" y="310" width="134" height="46" rx="10" fill="#f6f1ff"/><text x="899" y="328" fill="#667085" font-size="9">CORE RTB</text><text x="899" y="347" fill="#6d38ad" font-size="13" font-weight="700">PROOF</text>
      <rect x="1029" y="310" width="179" height="46" rx="10" fill="#f9f0f8"/><text x="1045" y="328" fill="#667085" font-size="9">EVIDENCE STATUS</text><text x="1045" y="347" fill="#9d367d" font-size="13" font-weight="700">7 FRAMES LOCKED</text>

      <!-- Timeline -->
      <text x="591" y="389" fill="#1e293b" font-size="10" font-weight="700" letter-spacing="1.5">CONFIRMED PRODUCT-AD TIMELINE</text>
      <line x1="591" y1="421" x2="1208" y2="421" stroke="#d9deea" stroke-width="10" stroke-linecap="round"/>
      <line x1="765" y1="421" x2="1026" y2="421" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="765" cy="421" r="7" fill="#67e8f9"/><circle cx="1026" cy="421" r="7" fill="#e879f9"/>
      <text x="591" y="445" fill="#94a0b4" font-size="9">00:00</text><text x="765" y="445" text-anchor="middle" fill="#5b66a0" font-size="9" font-weight="700">00:18.4</text><text x="1026" y="445" text-anchor="middle" fill="#895684" font-size="9" font-weight="700">00:36.1</text><text x="1208" y="445" text-anchor="end" fill="#94a0b4" font-size="9">01:00</text>

      <!-- Frames -->
      <text x="591" y="482" fill="#1e293b" font-size="10" font-weight="700" letter-spacing="1.5">SEVEN KEY EVIDENCE FRAMES</text>
      <g filter="url(#smallShadow)">
        <g transform="translate(591 500)"><rect width="80" height="70" rx="8" fill="url(#thumbA)"/><path d="M0 55c18-18 35-16 49-27s25-7 31-2v44H0z" fill="#2b263a"/><rect x="36" y="19" width="13" height="32" rx="4" fill="#d8bdcc"/><text x="40" y="84" text-anchor="middle" fill="#4b5563" font-size="8">HOOK</text></g>
        <g transform="translate(680 500)"><rect width="80" height="70" rx="8" fill="#262542"/><rect x="32" y="15" width="18" height="42" rx="5" fill="url(#thumbB)"/><rect x="36" y="9" width="10" height="12" rx="3" fill="#1e1b2b"/><text x="40" y="84" text-anchor="middle" fill="#4b5563" font-size="8">PRODUCT</text></g>
        <g transform="translate(769 500)"><rect width="80" height="70" rx="8" fill="#3d2d4b"/><ellipse cx="40" cy="37" rx="29" ry="13" fill="#d7adbe" opacity="0.8"/><path d="M15 34c16-11 35-12 50-2" fill="none" stroke="#f5d4e0" stroke-width="4" stroke-linecap="round"/><text x="40" y="84" text-anchor="middle" fill="#4b5563" font-size="8">DETAIL</text></g>
        <g transform="translate(858 500)"><rect width="80" height="70" rx="8" fill="#252a4d"/><rect x="9" y="11" width="62" height="40" rx="5" fill="#171c35"/><rect x="17" y="21" width="45" height="5" rx="2.5" fill="#aaa6ff"/><rect x="17" y="32" width="36" height="4" rx="2" fill="#67e8f9"/><text x="40" y="84" text-anchor="middle" fill="#4b5563" font-size="8">SELLING POINT</text></g>
        <g transform="translate(947 500)"><rect width="80" height="70" rx="8" fill="#3a2c4a"/><path d="M17 49c16-25 33-31 49-25" fill="none" stroke="#d8b8c9" stroke-width="9" stroke-linecap="round"/><circle cx="54" cy="25" r="8" fill="#f2dbe5"/><text x="40" y="84" text-anchor="middle" fill="#4b5563" font-size="8">USE 01</text></g>
        <g transform="translate(1036 500)"><rect width="80" height="70" rx="8" fill="#302945"/><path d="M19 24c15 3 26 15 42 27" fill="none" stroke="#d9b9ca" stroke-width="10" stroke-linecap="round"/><circle cx="26" cy="26" r="8" fill="#f2dbe5"/><text x="40" y="84" text-anchor="middle" fill="#4b5563" font-size="8">USE 02</text></g>
        <g transform="translate(1125 500)"><rect width="80" height="70" rx="8" fill="url(#thumbA)"/><ellipse cx="40" cy="33" rx="20" ry="24" fill="#d8b2c2"/><path d="M25 32c8 6 20 7 30 1" fill="none" stroke="#f3d8e3" stroke-width="3"/><text x="40" y="84" text-anchor="middle" fill="#4b5563" font-size="8">AFTER</text></g>
      </g>

      <!-- Insight -->
      <text x="591" y="619" fill="#1e293b" font-size="10" font-weight="700" letter-spacing="1.5">PRODUCT MARKETING INSIGHT</text>
      <rect x="591" y="636" width="617" height="101" rx="12" fill="#f0f2f8"/>
      <rect x="591" y="636" width="5" height="101" rx="3" fill="url(#accent)"/>
      <text x="614" y="660" fill="#3730a3" font-size="10" font-weight="700">CONTENT VALUE</text>
      <rect x="704" y="652" width="467" height="6" rx="3" fill="#cfd5e2"/>
      <text x="614" y="687" fill="#6d28a8" font-size="10" font-weight="700">PRODUCT PERCEPTION</text>
      <rect x="750" y="679" width="421" height="6" rx="3" fill="#cfd5e2"/>
      <text x="614" y="714" fill="#9d367d" font-size="10" font-weight="700">INTEGRATION MECHANISM</text>
      <rect x="767" y="706" width="404" height="6" rx="3" fill="#cfd5e2"/>
      <text x="591" y="771" fill="#718096" font-size="9">Evidence registry: subtitle 00:18.4 · frame 00:22.7 · observed action · spoken claim</text>
      <circle cx="1196" cy="768" r="6" fill="#22c55e"/><text x="1182" y="772" text-anchor="end" fill="#64748b" font-size="9" font-weight="700">TRACEABLE</text>
    </g>

    <!-- Left annotations -->
    <g>
      <path d="M509 316H448C430 316 430 253 409 253H383" fill="none" stroke="#7f91bf" stroke-width="1.5"/>
      <circle cx="509" cy="316" r="4" fill="#67e8f9" filter="url(#glow)"/>
      <text x="82" y="225" fill="#67e8f9" font-size="11" font-weight="700" letter-spacing="2">01 · CLASSIFICATION</text>
      <text x="82" y="251" fill="#f8fafc" font-size="17" font-weight="700">A defensible content decision</text>
      <text x="82" y="276" fill="#8491aa" font-size="13">Primary + secondary label, positive evidence,</text>
      <text x="82" y="296" fill="#8491aa" font-size="13">and the decisive exclusion boundary.</text>

      <path d="M509 422H448C430 422 430 415 409 415H383" fill="none" stroke="#7f91bf" stroke-width="1.5"/>
      <circle cx="509" cy="422" r="4" fill="#818cf8" filter="url(#glow)"/>
      <text x="82" y="388" fill="#aeb8ff" font-size="11" font-weight="700" letter-spacing="2">02 · AD TIMELINE</text>
      <text x="82" y="414" fill="#f8fafc" font-size="17" font-weight="700">Only confirmed product intervals</text>
      <text x="82" y="439" fill="#8491aa" font-size="13">Presentation + spoken name + selling point</text>
      <text x="82" y="459" fill="#8491aa" font-size="13">inside one continuous context.</text>

      <path d="M509 768H448C430 768 430 623 409 623H383" fill="none" stroke="#7f91bf" stroke-width="1.5"/>
      <circle cx="509" cy="768" r="4" fill="#a78bfa" filter="url(#glow)"/>
      <text x="82" y="596" fill="#d1c3ff" font-size="11" font-weight="700" letter-spacing="2">03 · SOURCE EVIDENCE</text>
      <text x="82" y="622" fill="#f8fafc" font-size="17" font-weight="700">Every insight resolves backward</text>
      <text x="82" y="647" fill="#8491aa" font-size="13">Timestamped subtitles, source frames, and</text>
      <text x="82" y="667" fill="#8491aa" font-size="13">evidence types remain independently inspectable.</text>
    </g>

    <!-- Right annotations -->
    <g>
      <path d="M1291 527h61c18 0 18-276 39-276h26" fill="none" stroke="#8f7baa" stroke-width="1.5"/>
      <circle cx="1291" cy="527" r="4" fill="#e879f9" filter="url(#glow)"/>
      <text x="1417" y="225" fill="#f0abfc" font-size="11" font-weight="700" letter-spacing="2">04 · SEVEN KEY FRAMES</text>
      <text x="1417" y="251" fill="#f8fafc" font-size="17" font-weight="700">Visual evidence with fixed roles</text>
      <text x="1417" y="276" fill="#9289a9" font-size="13">Hook, product, detail, selling point, two use</text>
      <text x="1417" y="296" fill="#9289a9" font-size="13">moments, and after-effect—or not detected.</text>

      <path d="M1291 683h61c18 0 18-268 39-268h26" fill="none" stroke="#8f7baa" stroke-width="1.5"/>
      <circle cx="1291" cy="683" r="4" fill="#d8b4fe" filter="url(#glow)"/>
      <text x="1417" y="388" fill="#dfc4ff" font-size="11" font-weight="700" letter-spacing="2">05 · STRATEGIC SYNTHESIS</text>
      <text x="1417" y="414" fill="#f8fafc" font-size="17" font-weight="700">One hierarchy, not a claim inventory</text>
      <text x="1417" y="439" fill="#9289a9" font-size="13">Content value, product perception, strongest</text>
      <text x="1417" y="459" fill="#9289a9" font-size="13">RTB, and the observed integration chain.</text>

      <path d="M1291 193h61c18 0 18 430 39 430h26" fill="none" stroke="#8f7baa" stroke-width="1.5"/>
      <circle cx="1291" cy="193" r="4" fill="#c4b5fd" filter="url(#glow)"/>
      <text x="1417" y="596" fill="#c4b5fd" font-size="11" font-weight="700" letter-spacing="2">06 · QA + TRACEABILITY</text>
      <text x="1417" y="622" fill="#f8fafc" font-size="17" font-weight="700">A report that must earn delivery</text>
      <text x="1417" y="647" fill="#9289a9" font-size="13">Coverage, schema, screenshot, transcript, font,</text>
      <text x="1417" y="667" fill="#9289a9" font-size="13">page integrity, and manual visual review.</text>
    </g>

    <line x1="72" y1="844" x2="1728" y2="844" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="72" y="870" fill="#66748f" font-size="10" font-weight="700" letter-spacing="2.6">SOURCE LOCKED</text>
    <text x="900" y="870" text-anchor="middle" fill="#7e89a5" font-size="10" font-weight="700" letter-spacing="2.6">CLAIM → EVIDENCE → DECISION</text>
    <text x="1728" y="870" text-anchor="end" fill="#917fa9" font-size="10" font-weight="700" letter-spacing="2.6">QA VERIFIED</text>
  </g>
</svg>
